#:schema node_modules/wrangler/config-schema.json
name = "suki-get"
main = "src/worker.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
